name: Generate Contracts and Sync to contracts repo

on:
    pull_request:
        types: [opened, synchronize, reopened]
    workflow_dispatch:
        inputs:
            job:
                description: 'Which job to run (default: all)'
                required: false
                default: 'all'

jobs:
    generate-and-sync:
        if: github.event_name == 'pull_request' || github.event.inputs.job == 'all'
        runs-on: ubuntu-latest
        outputs:
            pr_branch_name: ${{ steps.create_pr.outputs.branch_name }}
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: 24
                  cache: yarn

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Run contracts script
              run: yarn contracts

            - name: Format
              run: yarn format

            - name: Normalize contract files
              run: |
                  find contracts -type f -name "*.json" | while read -r file; do
                    jq --sort-keys . "$file" > "$file.tmp" && mv "$file.tmp" "$file"
                  done

            - name: Check for contract changes
              id: diff
              run: |
                  if git diff --quiet origin/master -- contracts; then
                    echo "changed=false" >> $GITHUB_OUTPUT
                  else
                    echo "changed=true" >> $GITHUB_OUTPUT
                  fi

            - name: Clone contracts repo and push branch
              id: push
              if: steps.diff.outputs.changed == 'true'
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"

                  git clone https://x-access-token:${{ secrets.CONTRACTS_PAT }}@github.com/dhis2/dhis2-api-contracts.git
                  cd dhis2-api-contracts

                  BRANCH_NAME="auto/contracts-update-${{ github.event.pull_request.number }}"
                  if git ls-remote --exit-code --heads origin "$BRANCH_NAME" > /dev/null; then
                    echo "Branch $BRANCH_NAME exists, checking it out"
                    git checkout "$BRANCH_NAME"
                  else
                    echo "Branch $BRANCH_NAME does not exist, creating it"
                    git checkout -b "$BRANCH_NAME"
                  fi

                  mkdir -p ./contracts/metadata-management-app
                  cp -r ../contracts/* ./contracts/metadata-management-app/

                  git add .
                  if git diff --cached --quiet; then
                    echo "No changes to commit after copy."
                    echo "pushed=false" >> $GITHUB_OUTPUT
                    exit 0
                  fi

                  git commit -m "Auto-update contracts from metadata management app PR #${{ github.event.pull_request.number }}"
                  git push origin $BRANCH_NAME
                  echo "pushed=true" >> $GITHUB_OUTPUT

            - name: Create Pull Request in contract repo
              id: create_pr
              if: steps.push.outputs.pushed == 'true'
              run: |
                  cd dhis2-api-contracts
                  BRANCH_NAME="auto/contracts-update-${{ github.event.pull_request.number }}"
                  gh auth login --with-token <<< "${{ secrets.CONTRACTS_PAT }}"

                  # Compute which contract folders were added, removed, or modified
                  git ls-tree --name-only main:contracts/metadata-management-app/ 2>/dev/null | sort > /tmp/main_folders.txt
                  git ls-tree --name-only HEAD:contracts/metadata-management-app/ 2>/dev/null | sort > /tmp/current_folders.txt

                  ADDED=$(comm -23 /tmp/current_folders.txt /tmp/main_folders.txt | paste -sd ', ' -)
                  REMOVED=$(comm -13 /tmp/current_folders.txt /tmp/main_folders.txt | paste -sd ', ' -)
                  MODIFIED=""
                  while IFS= read -r folder; do
                    [ -z "$folder" ] && continue
                    if ! git diff --quiet main HEAD -- "contracts/metadata-management-app/$folder/"; then
                      MODIFIED="${MODIFIED:+$MODIFIED, }$folder"
                    fi
                  done < <(comm -12 /tmp/current_folders.txt /tmp/main_folders.txt)

                  TITLE_SUFFIX=""
                  [ -n "$ADDED" ]    && TITLE_SUFFIX="${TITLE_SUFFIX} Added contracts: ${ADDED}."
                  [ -n "$REMOVED" ]  && TITLE_SUFFIX="${TITLE_SUFFIX} Removed contracts: ${REMOVED}."
                  [ -n "$MODIFIED" ] && TITLE_SUFFIX="${TITLE_SUFFIX} Modified contracts: ${MODIFIED}."

                  PR_TITLE="Auto PR: Contracts from metadata management app PR #${{ github.event.pull_request.number }}"
                  PR_BODY="This PR was automatically created from a pull request in metadata management app.${TITLE_SUFFIX}"

                  # Create or update the PR
                  EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --base main --json number --jq '.[0].number')
                  if [ -n "$EXISTING_PR" ]; then
                    echo "PR #$EXISTING_PR already exists for branch $BRANCH_NAME, updating body."
                    gh pr edit "$EXISTING_PR" --body "$PR_BODY"
                  else
                    gh pr create \
                      --base main \
                      --head "$BRANCH_NAME" \
                      --title "$PR_TITLE" \
                      --body "$PR_BODY" \
                      --reviewer dhis2/platform-backend
                  fi

                  # Output the branch name safely for downstream jobs
                  echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

    check-contracts-pr:
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request'
        steps:
            - name: Check for open contracts PR
              run: |
                  echo "${{ secrets.CONTRACTS_PAT }}" | gh auth login --with-token
                  BRANCH_NAME="auto/contracts-update-${{ github.event.pull_request.number }}"

                  OPEN_PR=$(gh pr list \
                    --repo dhis2/dhis2-api-contracts \
                    --head "$BRANCH_NAME" \
                    --base main \
                    --state open \
                    --json number \
                    --jq '.[0].number')

                  if [ -n "$OPEN_PR" ]; then
                    echo "::error::Contracts PR #$OPEN_PR in dhis2/dhis2-api-contracts is still open. Close or merge it before merging this PR."
                    exit 1
                  fi
                  echo "No open contracts PR — safe to merge."
