<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" role="img" aria-label="The same facility values, aggregated with three different aggregation operators, give three different district totals, because each operator combines periods and organisation units independently.">
<rect x="0" y="0" width="1000" height="560" fill="#FFFFFF"/>
<defs>
<marker id="arrTealAx" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#00897B"/></marker>
<marker id="arrBlueAx" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#147CD7"/></marker>
</defs>
<rect x="40" y="20" width="920" height="116" rx="10" fill="#F3F5F7" stroke="#D5DDE5" stroke-width="1.4"/>
<text x="58" y="44" font-size="13.5" font-weight="700" fill="#212934" text-anchor="start">Same facility data, for one period (a quarter of 3 months)</text>
<text x="58" y="81" font-size="12.5" font-weight="700" fill="#147CD7" text-anchor="start">Facility A</text><rect x="230" y="60" width="64" height="32" rx="8" fill="#FFFFFF" stroke="#147CD7" stroke-width="1.3"/><text x="262" y="73" font-size="9.5" font-weight="600" fill="#6C7787" text-anchor="middle">Jan</text><text x="262" y="87" font-size="13.5" font-weight="700" fill="#212934" text-anchor="middle">10</text><rect x="304" y="60" width="64" height="32" rx="8" fill="#FFFFFF" stroke="#147CD7" stroke-width="1.3"/><text x="336" y="73" font-size="9.5" font-weight="600" fill="#6C7787" text-anchor="middle">Feb</text><text x="336" y="87" font-size="13.5" font-weight="700" fill="#212934" text-anchor="middle">20</text><rect x="378" y="60" width="64" height="32" rx="8" fill="#FFFFFF" stroke="#147CD7" stroke-width="1.3"/><text x="410" y="73" font-size="9.5" font-weight="600" fill="#6C7787" text-anchor="middle">Mar</text><text x="410" y="87" font-size="13.5" font-weight="700" fill="#212934" text-anchor="middle">30</text>
<text x="58" y="123" font-size="12.5" font-weight="700" fill="#00897B" text-anchor="start">Facility B</text><rect x="230" y="102" width="64" height="32" rx="8" fill="#FFFFFF" stroke="#00897B" stroke-width="1.3"/><text x="262" y="115" font-size="9.5" font-weight="600" fill="#6C7787" text-anchor="middle">Jan</text><text x="262" y="129" font-size="13.5" font-weight="700" fill="#212934" text-anchor="middle">5</text><rect x="304" y="102" width="64" height="32" rx="8" fill="#FFFFFF" stroke="#00897B" stroke-width="1.3"/><text x="336" y="115" font-size="9.5" font-weight="600" fill="#6C7787" text-anchor="middle">Feb</text><text x="336" y="129" font-size="13.5" font-weight="700" fill="#212934" text-anchor="middle">15</text><rect x="378" y="102" width="64" height="32" rx="8" fill="#FFFFFF" stroke="#00897B" stroke-width="1.3"/><text x="410" y="115" font-size="9.5" font-weight="600" fill="#6C7787" text-anchor="middle">Mar</text><text x="410" y="129" font-size="13.5" font-weight="700" fill="#212934" text-anchor="middle">10</text>
<text x="190.0" y="166" font-size="14" font-weight="700" fill="#093371" text-anchor="middle">Sum</text>
<text x="190.0" y="184" font-size="10.5" font-weight="600" fill="#6C7787" text-anchor="middle">Over periods: Sum  ·  Over org units: Sum</text>
<rect x="50.0" y="200" width="280" height="56" rx="10" fill="#FFFFFF" stroke="#147CD7" stroke-width="1.6"/>
<text x="190.0" y="220" font-size="12" font-weight="600" fill="#212934" text-anchor="middle">Sum over periods</text>
<text x="66.0" y="242" font-size="11.5" font-weight="500" fill="#4A5768" text-anchor="start">Facility A → 60</text>
<text x="208.0" y="242" font-size="11.5" font-weight="500" fill="#4A5768" text-anchor="start">Facility B → 30</text>
<line x1="190.0" y1="256" x2="190.0" y2="286" stroke="#147CD7" stroke-width="1.8" marker-end="url(#arrBlueAx)"/>
<rect x="50.0" y="290" width="280" height="56" rx="10" fill="#E3F2FD" stroke="#147CD7" stroke-width="1.6"/>
<text x="190.0" y="310" font-size="12" font-weight="700" fill="#093371" text-anchor="middle">Sum over org unit hierarchy</text>
<text x="190.0" y="332" font-size="11" font-weight="500" fill="#4A5768" text-anchor="middle">60  and  30  combine</text>
<line x1="190.0" y1="346" x2="190.0" y2="372" stroke="#147CD7" stroke-width="1.8" marker-end="url(#arrBlueAx)"/>
<rect x="50.0" y="376" width="280" height="62" rx="12" fill="#093371" stroke="#093371" stroke-width="0"/>
<text x="190.0" y="402" font-size="11.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">District total</text>
<text x="190.0" y="426" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle">90</text>
<text x="500.0" y="166" font-size="14" font-weight="700" fill="#00332B" text-anchor="middle">Average</text>
<text x="500.0" y="184" font-size="10.5" font-weight="600" fill="#6C7787" text-anchor="middle">Over periods: Average  ·  Over org units: Average</text>
<rect x="360.0" y="200" width="280" height="56" rx="10" fill="#FFFFFF" stroke="#00897B" stroke-width="1.6"/>
<text x="500.0" y="220" font-size="12" font-weight="600" fill="#212934" text-anchor="middle">Average over periods</text>
<text x="376.0" y="242" font-size="11.5" font-weight="500" fill="#4A5768" text-anchor="start">Facility A → 20</text>
<text x="518.0" y="242" font-size="11.5" font-weight="500" fill="#4A5768" text-anchor="start">Facility B → 10</text>
<line x1="500.0" y1="256" x2="500.0" y2="286" stroke="#00897B" stroke-width="1.8" marker-end="url(#arrTealAx)"/>
<rect x="360.0" y="290" width="280" height="56" rx="10" fill="#E0F2F1" stroke="#00897B" stroke-width="1.6"/>
<text x="500.0" y="310" font-size="12" font-weight="700" fill="#00332B" text-anchor="middle">Average over org unit hierarchy</text>
<text x="500.0" y="332" font-size="11" font-weight="500" fill="#4A5768" text-anchor="middle">20  and  10  combine</text>
<line x1="500.0" y1="346" x2="500.0" y2="372" stroke="#00897B" stroke-width="1.8" marker-end="url(#arrTealAx)"/>
<rect x="360.0" y="376" width="280" height="62" rx="12" fill="#00332B" stroke="#00332B" stroke-width="0"/>
<text x="500.0" y="402" font-size="11.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">District total</text>
<text x="500.0" y="426" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle">15</text>
<text x="810.0" y="166" font-size="14" font-weight="700" fill="#6F3205" text-anchor="middle">Average (sum in org unit hierarchy)</text>
<text x="810.0" y="184" font-size="10.5" font-weight="600" fill="#6C7787" text-anchor="middle">Over periods: Average  ·  Over org units: Sum</text>
<rect x="670.0" y="200" width="280" height="56" rx="10" fill="#FFFFFF" stroke="#E56408" stroke-width="1.6"/>
<text x="810.0" y="220" font-size="12" font-weight="600" fill="#212934" text-anchor="middle">Average over periods</text>
<text x="686.0" y="242" font-size="11.5" font-weight="500" fill="#4A5768" text-anchor="start">Facility A → 20</text>
<text x="828.0" y="242" font-size="11.5" font-weight="500" fill="#4A5768" text-anchor="start">Facility B → 10</text>
<line x1="810.0" y1="256" x2="810.0" y2="286" stroke="#E56408" stroke-width="1.8" marker-end="url(#arrTealAx)"/>
<rect x="670.0" y="290" width="280" height="56" rx="10" fill="#FFECB3" stroke="#E56408" stroke-width="1.6"/>
<text x="810.0" y="310" font-size="12" font-weight="700" fill="#6F3205" text-anchor="middle">Sum over org unit hierarchy</text>
<text x="810.0" y="332" font-size="11" font-weight="500" fill="#4A5768" text-anchor="middle">20  and  10  combine</text>
<line x1="810.0" y1="346" x2="810.0" y2="372" stroke="#E56408" stroke-width="1.8" marker-end="url(#arrTealAx)"/>
<rect x="670.0" y="376" width="280" height="62" rx="12" fill="#6F3205" stroke="#6F3205" stroke-width="0"/>
<text x="810.0" y="402" font-size="11.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">District total</text>
<text x="810.0" y="426" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle">30</text>
<text x="500.0" y="464" font-size="12.5" font-weight="600" fill="#4A5768" text-anchor="middle">Same nine input numbers — three different totals, because “Sum” and “Average (sum in org unit hierarchy)”</text>
<text x="500.0" y="482" font-size="12.5" font-weight="600" fill="#4A5768" text-anchor="middle">answer the org-unit axis differently. Work out which axis you actually meant before trusting a total.</text>
</svg>